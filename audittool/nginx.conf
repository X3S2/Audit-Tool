server {
    listen 80;
    server_name _;

    # Browser-Uploads (Raumbilder, Backup-Dateien) koennen mehrere MB gross werden.
    client_max_body_size 200m;

    # Statische Frontend-Dateien (React-Build)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-Proxy fuer die Backend-API: das Frontend ruft ausschliesslich relative "/api"-Pfade
    # auf (siehe App.tsx API_BASE). Dadurch muss fuer den Browser nur EIN externer Port (der von
    # diesem nginx) erreichbar sein - das Backend bleibt intern im Docker-Netzwerk und braucht
    # keinen eigenen, separat weiterzuleitenden Port mehr. Das ist entscheidend fuer Deployments
    # hinter einem Router/CDN (z.B. Synology NAS + CloudRouter/CDN via ipv64.net), wo i.d.R. nur
    # ein einzelner externer Port auf einen einzigen internen Port weitergeleitet werden kann.
    location /api/ {
        proxy_pass http://audittool-backend-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
