server {
    listen 80;
    server_name _;

    # Browser-Uploads (Raumbilder, Backup-Dateien) koennen mehrere hundert MB gross werden -
    # insbesondere Backups, die neben der Datenbank auch ausgelagerte Mediendateien enthalten
    # (fix010). Muss mit dem Backend-Limit (Kestrel MaxRequestBodySize / FormOptions in
    # Program.cs) uebereinstimmen oder darueber liegen.
    client_max_body_size 1024m;

    # fix010 Schritt 3b: gzip-Kompression fuer Text-/JSON-Antworten (ergaenzt die serverseitige
    # Brotli/Gzip-Kompression des Backends fuer die ueber nginx ausgelieferten statischen Dateien)
    # sowie explizites UTF-8-Charset, damit deutsche Umlaute in allen Antworten korrekt ankommen.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;
    charset utf-8;

    # Statische Frontend-Dateien (React-Build)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        # index.html referenziert die aktuell gueltigen, hash-benannten Assets - es darf nie
        # unbemerkt veraltet aus dem Browser-Cache kommen (sonst zeigt ein Reload nach einem
        # Deployment ggf. eine Mischung aus altem HTML und neuen Assets).
        add_header Cache-Control "no-cache";
    }

    # Hash-benannte Build-Assets (JS/CSS) aendern bei jeder neuen Version ihren Dateinamen -
    # koennen daher gefahrlos ein Jahr lang unveraenderlich im Browser-Cache gehalten werden.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse-Proxy fuer die Backend-API: das Frontend ruft ausschliesslich relative "/api"-Pfade
    # auf (siehe App.tsx API_BASE). Dadurch muss fuer den Browser nur EIN externer Port (der von
    # diesem nginx) erreichbar sein - das Backend bleibt intern im Docker-Netzwerk und braucht
    # keinen eigenen, separat weiterzuleitenden Port mehr. Das ist entscheidend fuer Deployments
    # hinter einem Router/CDN (z.B. Synology NAS + CloudRouter/CDN via ipv64.net), wo i.d.R. nur
    # ein einzelner externer Port auf einen einzigen internen Port weitergeleitet werden kann.
    location /api/ {
        proxy_pass http://audittool-backend-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        # Grosse Backup-Uploads/Downloads und das serverseitige Erstellen/Wiederherstellen
        # grosser Backups koennen laenger als die Standard-60s dauern (insbesondere bei
        # eingeschraenkter Bandbreite ueber CDN/Router) - daher grosszuegigere Timeouts.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
        proxy_set_header Connection "upgrade";
    }
}
