version: '3.9'

services:
  audittool-postgres-db:
    image: postgres:16-alpine
    container_name: audittool-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audittool}
      POSTGRES_USER: ${POSTGRES_USER:-audittool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AuditTool!2026}
    ports:
      - "5432:5432"
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    networks:
      - audittool-network

  audittool-backend-api:
    build:
      context: ..
      dockerfile: audittool/Dockerfile.backend
    container_name: audittool-backend-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=audittool-postgres-db;Database=${POSTGRES_DB:-audittool};Username=${POSTGRES_USER:-audittool};Password=${POSTGRES_PASSWORD:-AuditTool!2026}
      Jwt__Key: ${JWT_KEY:-AuditTool-Dev-Key-Change-me-in-production-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-audit-tool}
      Jwt__Audience: ${JWT_AUDIENCE:-audit-tool-clients}
    ports:
      - "5050:8080"
    depends_on:
      - audittool-postgres-db
    networks:
      - audittool-network

  audittool-frontend-ui:
    build:
      context: ..
      dockerfile: audittool/Dockerfile.frontend
    container_name: audittool-frontend-ui
    restart: unless-stopped
    ports:
      - "4714:80"
    depends_on:
      - audittool-backend-api
    networks:
      - audittool-network

volumes:
  audit_postgres_data:

networks:
  audittool-network:
    driver: bridge
