name: audittool

services:
  audittool-postgres-db:
    image: postgres:16-alpine
    container_name: audittool-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-audittool}
      POSTGRES_USER: ${POSTGRES_USER:-audittool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AuditTool!2026}
    # fix010 Schritt 8a: Keine ports-Freigabe mehr - der Postgres-Dienst wird vom Backend aktuell
    # nicht genutzt (DatabaseMigrationService wird nirgends aufgerufen, die eigentliche Datenhaltung
    # laeuft ueber SQLite/AppDatabase). Der Dienst bleibt als Option fuer eine spaetere Migration
    # bestehen, muss dafuer aber nicht von aussen erreichbar sein; der Zugriff innerhalb des
    # audittool-network (fuer ein eventuelles kuenftiges Backend) bleibt unveraendert moeglich.
    volumes:
      - audit_postgres_data:/var/lib/postgresql/data
    networks:
      - audittool-network

  audittool-backend-api:
    build:
      context: ..
      dockerfile: audittool/Dockerfile.backend
    container_name: audittool-backend-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=audittool-postgres-db;Database=${POSTGRES_DB:-audittool};Username=${POSTGRES_USER:-audittool};Password=${POSTGRES_PASSWORD:-AuditTool!2026}
      Jwt__Key: ${JWT_KEY:-AuditTool-Dev-Key-Change-me-in-production-1234567890}
      Jwt__Issuer: ${JWT_ISSUER:-audit-tool}
      Jwt__Audience: ${JWT_AUDIENCE:-audit-tool-clients}
      # fix010 Schritt 5c/8a: Stellt sicher, dass auch ohne IANA-Zeitzonendaten im Image (Fallback des
      # BackupService auf "Europe/Berlin" via TimeZoneInfo) die Container-Systemzeit selbst bereits in
      # der richtigen Zeitzone läuft - u.a. relevant für Zeitstempel in Logs und Dateinamen.
      TZ: Europe/Berlin
    ports:
      - "5050:8080"
    # Hinweis: Dieser Port wird vom Browser NICHT mehr benoetigt (das Frontend ruft die API ueber
    # seinen eigenen nginx-Reverse-Proxy unter "/api" auf, der intern an diesen Container
    # weiterleitet). Die Freigabe hier dient nur optionalen Zwecken wie direktem API-Zugriff fuer
    # Diagnose/Tools. Fuer Deployments hinter einem Router/CDN (z.B. Synology NAS +
    # CloudRouter/CDN) MUSS nur der Frontend-Port (siehe unten, Standard 4714) nach aussen
    # weitergeleitet werden - dieser Port kann dort ungenutzt/ungeforwardet bleiben.
    depends_on:
      - audittool-postgres-db
    volumes:
      - audit_storage_data:/storage
    networks:
      - audittool-network

  audittool-frontend-ui:
    build:
      context: ..
      dockerfile: audittool/Dockerfile.frontend
    container_name: audittool-frontend-ui
    restart: unless-stopped
    ports:
      - "4714:80"
    depends_on:
      - audittool-backend-api
    networks:
      - audittool-network

volumes:
  audit_postgres_data:
  audit_storage_data:

networks:
  audittool-network:
    driver: bridge
